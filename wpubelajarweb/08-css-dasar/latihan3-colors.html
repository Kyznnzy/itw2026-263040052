<html lang="id">

<head>
  <meta charset="UTF-8">
  <title>Quote</title>
  <style>
    body {
      font-family: 'Courier New', Courier, monospace;
      font-weight: bold;
      color: rgb(247, 235, 235);
      text-align: center;
      background-color: rgb(17, 13, 66);
    }

    h1 {
      font-size: 48px;
      text-transform: uppercase;
      font-style: italic;
      letter-spacing: 10px;
      text-decoration: underline;
      text-decoration-style: wavy;
      text-decoration-color: rgb(239, 6, 6);
      text-shadow: 5px 5px 0 rgb(11, 11, 11);
    }

    .quote {
      font-size: 22px;
      line-height: 2.2;
      word-spacing: 5px;
    }

    span {
      color:rgb(208, 138, 138);
      text-decoration: line-through;
    }

    .credit {
      font-size: 12px;
      letter-spacing: 2px;
      color: rgb(184, 184, 190);
      font-weight: normal;
    }
  </style>
</head>

<body>

  <h1>quote</h1>

  <p class="quote">
    “We cannot solve <span>Problems</span> with the kind of thinking we employed when we came up with them."
  </p>

  <p class="credit">— Albert Einstein</p>

</body>

</html>
