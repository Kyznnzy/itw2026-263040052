<html lang="id">

<head>
  <meta charset="UTF-8">
  <title>Quote</title>
  <style>
    body {
      font-family: 'Courier New', Courier, monospace;
      font-weight: bold;
      color: rgb(247, 235, 235);
      text-align: center;
      background-color: rgb(17, 13, 66);
      background-image: linear-gradient(to bottom, rgb(15 23 42 / 90%) 60%, rgb(15 23 42 / 40%)), url("https://fastly.picsum.photos/id/288/1000/1000.jpg?hmac=g45YxmYKZYl0LSLl-kB2Z8YcbUA9F2VJTiPRfbs3pLE");
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      min-height: 100vh;
    }

    h1 {
      font-size: 4em;
      text-transform: uppercase;
      font-style: italic;
      letter-spacing: 10px;
      background-image: linear-gradient(to right, rgb(239 6 6) 30%, rgb(255 255 255));
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
      filter: drop-shadow(0 0 10px rgb(37 15 161));
    }

    .quote {
      font-size: 22px;
      line-height: 2.2;
      word-spacing: 5px;
      background-color: rgb(255 255 255 / 5%);
      max-width: 700px;
      margin: auto;
      padding: 40px;
      border-radius: 20px;
      border: 1px solid rgb(255 255 255 / 10%);
      box-shadow: 0 10px 30px rgb(0 0 0 / 50%);
    }

    span {
      color:crimson;
      text-decoration: none;
      text-shadow: 0 0 10px rgb(248 50 89 / 80%);
    }

    .credit {
      font-size: 12px;
      letter-spacing: 2px;
      color: rgb(184, 184, 190);
      font-weight: normal;
      text-transform: uppercase;
      border-top: 1px solid rgb(255 255 255 / 20%);
      width: 30%;
      margin: 30px auto;
      padding-top: 20px;
    }
  </style>
</head>

<body>

  <h1>quote</h1>

  <p class="quote">
    “We cannot solve <span>Problems</span> with the kind of thinking we employed when we came up with them."
  </p>

  <p class="credit">— Albert Einstein</p>

</body>

</html>
